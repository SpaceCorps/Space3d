server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript text/plain image/svg+xml application/wasm;
  gzip_min_length 1024;
  add_header X-Content-Type-Options nosniff;
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  location /play/ { add_header Cache-Control "public, max-age=3600"; add_header X-Content-Type-Options nosniff; try_files $uri $uri/index.html =404; }
  location ~ \.(md|txt)$ { default_type text/plain; charset utf-8; }
  location / { try_files $uri $uri/ =404; }
}
