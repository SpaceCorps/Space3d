server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript text/plain image/svg+xml application/wasm application/octet-stream model/gltf-binary;
  gzip_min_length 1024;
  add_header X-Content-Type-Options nosniff;
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  # The docs are one page (generated docs/index.html); /docs and the old /docs.html serve it.
  location = /docs { rewrite ^ /docs/index.html last; }
  location = /docs.html { rewrite ^ /docs/index.html last; }
  # the city demo's CC0 assets (HDRI, textures, models): versioned with the site, cached for a day
  location /play/city_demo/assets/ { add_header Cache-Control "public, max-age=86400"; add_header X-Content-Type-Options nosniff; try_files $uri =404; }
  location /play/ { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff; try_files $uri $uri/index.html =404; }
  location ~ \.(md|txt)$ { default_type text/plain; charset utf-8; }
  location / { try_files $uri $uri/ =404; }
}
