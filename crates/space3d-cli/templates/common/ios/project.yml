# XcodeGen spec: `xcodegen generate` (in this directory) writes {{name}}.xcodeproj.
name: {{name}}
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    CARGO_PACKAGE: {{name}}-mobile
    RUST_LIB_NAME: {{crate_name}}_mobile
targets:
  {{name}}:
    type: application
    platform: iOS
    sources:
      - path: main.m
      - path: ../assets
        type: folder
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "{{title}}"
        UILaunchScreen: {}
        # The scene life cycle the iOS 27 SDK requires; the delegate is the engine's class
        # (space3d-platform, src/ios.rs).
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: Space3dSceneDelegate
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: {{ios_bundle_id}}
        TARGETED_DEVICE_FAMILY: "1,2"
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": $(PROJECT_DIR)/../target/aarch64-apple-ios/$(CARGO_PROFILE)
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": $(PROJECT_DIR)/../target/aarch64-apple-ios-sim/$(CARGO_PROFILE)
        OTHER_LDFLAGS: -l$(RUST_LIB_NAME) -lc++ -framework Metal -framework QuartzCore -framework UIKit -framework Foundation -framework CoreGraphics -framework CoreFoundation -framework AudioToolbox -framework AVFoundation -framework CoreAudio -framework Security -framework SystemConfiguration
      configs:
        Debug:
          CARGO_PROFILE: debug
        Release:
          CARGO_PROFILE: release
    preBuildScripts:
      - name: Build Rust library
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          # Build scripts and proc-macros run on the Mac: give them the macOS SDK's libraries.
          if [ -n "${DEVELOPER_SDK_DIR:-}" ]; then
            export LIBRARY_PATH="${DEVELOPER_SDK_DIR}/MacOSX.sdk/usr/lib:${LIBRARY_PATH:-}"
          fi
          if [ "$PLATFORM_NAME" = "iphonesimulator" ]; then TARGET=aarch64-apple-ios-sim; else TARGET=aarch64-apple-ios; fi
          PROFILE_FLAG=""
          if [ "$CONFIGURATION" = "Release" ]; then PROFILE_FLAG="--release"; fi
          cd "$PROJECT_DIR/.."
          cargo build -p "$CARGO_PACKAGE" --lib --target "$TARGET" $PROFILE_FLAG
    scheme: {}
