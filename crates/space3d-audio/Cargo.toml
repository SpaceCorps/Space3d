[package]
name = "space3d-audio"
description = "Space3d audio: kira-based playback, mixer buses, tweens and spatial emitters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
space3d-core.workspace = true
kira.workspace = true
# `mint`: kira takes its listener/emitter positions as `Into<mint::Vector3>`; this crate relies on
# glam converting to it, and must not depend on kira happening to enable the feature on the same
# glam version (in a fresh dependency resolution kira can pick a newer glam than the engine's).
glam = { workspace = true, features = ["mint"] }
tracing.workspace = true
thiserror.workspace = true
