[package]
name = "space3d-platform"
description = "Space3d platform layer: winit runner (desktop, web, Android, iOS), input and action mapping"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
space3d-core.workspace = true
space3d-render.workspace = true
winit.workspace = true
glam.workspace = true
tracing.workspace = true
web-time.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = ["Window", "Document", "Element", "HtmlCanvasElement", "Navigator"] }
console_error_panic_hook.workspace = true
tracing-wasm.workspace = true

# `Win32_Graphics_Gdi` (monitors, screen coordinates) and `Win32_UI_Shell` (is a taskbar set to
# auto-hide?): content under the title bar (src/title_bar/windows.rs).
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Content under the title bar (src/title_bar/macos.rs): where the traffic lights are. The objc2
# crates winit 0.30 itself uses.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"
objc2-app-kit = { version = "0.2.2", features = ["NSButton", "NSControl", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.2.2", features = ["NSGeometry"] }

# Gamepads (src/gamepad.rs). Desktop only: gilrs has no Android or iOS backend (Android pads
# come through winit's key events, runner.rs), and the web one is not wired yet.
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
gilrs.workspace = true

[dev-dependencies]
image.workspace = true
space3d-tasks.workspace = true

# OS keyboard-layout tables, read on the main thread (macOS Text Input Sources are
# main-thread only; libtest runs tests on worker threads).
[[test]]
name = "os_layout"
harness = false

# A virtual Xbox 360 pad through ViGEmBus (examples/virtual_pad.rs): the real backend's proof on
# a Windows PC without a pad. Never part of a shipped build. MIT.
[target.'cfg(target_os = "windows")'.dev-dependencies]
vigem-client = "0.1.4"

# The scene delegate (src/ios.rs); the objc2 winit 0.30 itself uses.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.5.2"

[target.'cfg(target_os = "android")'.dependencies]
winit = { workspace = true, features = ["android-native-activity"] }
# Questions to the activity (src/android.rs); the jni android-activity itself uses.
jni = "0.22.4"
