[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]
# third_party/: patched copies of crates.io crates (third_party/README.md), not members.
exclude = ["target", "third_party"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
# Not published to any registry (yet); the source is public under Apache-2.0.
publish = false
repository = "https://github.com/SpaceCorps/Space3d"
authors = ["SpaceCorps"]

# Policy: every dependency is pinned to its latest *stable* release.
# `cargo xtask`-style check lives in CI (see .github/workflows/deps.yml).
[workspace.dependencies]
# internal
space3d = { path = "crates/space3d" }
space3d-core = { path = "crates/space3d-core" }
space3d-tasks = { path = "crates/space3d-tasks" }
space3d-render = { path = "crates/space3d-render" }
space3d-assets = { path = "crates/space3d-assets" }
space3d-net = { path = "crates/space3d-net" }
space3d-db = { path = "crates/space3d-db" }
space3d-github = { path = "crates/space3d-github" }
space3d-audio = { path = "crates/space3d-audio" }
space3d-physics = { path = "crates/space3d-physics" }
space3d-scene = { path = "crates/space3d-scene" }
space3d-platform = { path = "crates/space3d-platform" }
space3d-ui = { path = "crates/space3d-ui" }
space3d-editor = { path = "crates/space3d-editor" }
space3d-stories = { path = "crates/space3d-stories" }
space3d-test = { path = "crates/space3d-test" }
space3d-replication = { path = "crates/space3d-replication" }
space3d-server = { path = "crates/space3d-server" }
space3d-particles = { path = "crates/space3d-particles" }

# core / ecs / math
hecs = "0.11.1"
glam = { version = "0.34.3", features = ["bytemuck", "serde"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
smallvec = "1.16.1"
ahash = { version = "0.8.12", default-features = false, features = ["std"] }
parking_lot = "0.12.5"
rayon = "1.12.0"
crossbeam-channel = "0.5.17"
web-time = "1.1.0"
uuid = { version = "1.26.1", features = ["v4", "serde"] }

# async
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "time", "net", "macros", "io-util"] }
tokio-util = "0.7.19"
futures = "0.3.34"
pollster = "1.0.1"
async-channel = "2.5.0"

# rendering / windowing / ui
wgpu = "30.0.1"
naga = "30.0.1"
winit = "0.30.13"          # latest stable; 0.31 is still beta and egui 0.36 targets 0.30
gilrs = "0.11.2"           # gamepads on desktop (Windows.Gaming.Input, evdev, IOKit); Apache-2.0/MIT
egui = "0.36.2"
egui-wgpu = { version = "0.36.2", features = ["winit"] }
egui-winit = "0.36.2"
egui_extras = "0.36.2"
raw-window-handle = "0.6.2"

# assets
image = "0.25.10"
gltf = "1.4.1"
bevy_mikktspace = "1.0.0"
tobj = "4.0.5"
notify = "8.2.0"
image-compare = "0.5.0"

# net
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
axum = { version = "0.8.9", features = ["ws"] }
tower-http = { version = "0.7.1", features = ["fs", "cors"] }
# Own accept loop of `HttpServer` (header-read timeout, connection caps); same versions axum uses.
hyper = { version = "1.11.1", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio", "service"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
http = "1.5.0"
url = "2.5.8"
base64 = "0.23.1"

# db
rusqlite = { version = "0.40.2", features = ["bundled"] }

# audio
kira = "0.12.4"

# serialization / errors / logging
serde = { version = "1.0.229", features = ["derive"] }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
serde_json = "1.0.151"
ron = "0.12.2"
toml = "1.1.6"
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
log = "0.4.34"

# security (game server / player service)
hmac = "0.13.0"
sha2 = "0.11.0"
getrandom = "0.4.3"
argon2 = "0.6.0"

# cli
clap = { version = "4.6.7", features = ["derive"] }
include_dir = "0.7.4"
tempfile = "3.27.0"

# web / wasm
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.78"
web-sys = "0.3.105"
js-sys = "0.3.105"
# Windows keyboard layout labels (space3d-platform); latest stable, already locked via other deps.
windows-sys = "0.61.2"
console_error_panic_hook = "0.1.7"
tracing-wasm = "0.2.1"

# testing / bench
criterion = "0.8.2"
proptest = "1.11.0"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.profiling]
inherits = "release"
debug = true

# Dedicated game server / player service builds: `cargo build --profile server`.
# `panic = "unwind"` so a panicking room is caught (`catch_unwind`) and restored
# instead of aborting every room in the process.
[profile.server]
inherits = "release"
panic = "unwind"

# egui's text layout with kinsoku (禁則処理) line breaking for Chinese and Japanese: a copy of
# epaint with a small patch (third_party/README.md, third_party/epaint.kinsoku.patch). Every
# Space3d app, test and example lays text out with it; games add the same line, see
# docs/ui.md "Chinese and Japanese line breaking". Keep its version equal to `egui` above:
# after an egui bump run scripts/update-epaint.py (cargo only warns about an unused patch;
# `epaint_resolves_to_the_vendored_kinsoku_copy` in space3d-ui fails).
[patch.crates-io]
epaint = { path = "third_party/epaint" }
