name: Site
# Builds the space3d.dev container (site/Dockerfile). On PRs: build only. On main / release:
# push ghcr.io/spacecorps/space3d-site and (optional) trigger the Sliplane redeploy.
on:
  push:
    branches: [main]
    paths: ["site/**", "docs/**", "integrations/**", "crates/**", "examples/**", "Cargo.lock", "README.md", ".github/workflows/site.yml"]
  pull_request:
    paths: ["site/**", "docs/**", "integrations/**", "crates/**", "examples/**", "Cargo.lock", "README.md", ".github/workflows/site.yml"]
  workflow_call:
    inputs:
      version_tag: { type: string, required: false, default: "" }
    secrets:
      SLIPLANE_DEPLOY_HOOK: { required: false }
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/spacecorps/space3d-site
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || inputs.version_tag != '' }}
            type=raw,value=${{ inputs.version_tag }},enable=${{ inputs.version_tag != '' }}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: site/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Sliplane: create the service from this image once, then add its deploy webhook URL as the
      # repo secret SLIPLANE_DEPLOY_HOOK. Skipped while the secret is unset.
      - name: Redeploy on Sliplane
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env: { HOOK: "${{ secrets.SLIPLANE_DEPLOY_HOOK }}" }
        run: |
          if [ -z "$HOOK" ]; then echo "SLIPLANE_DEPLOY_HOOK not set; skipping"; else curl -fsS -X POST "$HOOK"; fi

  # The committed site/src/spacecorps-tokens.css must equal what the published design-system
  # version (site/design-system.json) contains. Needs this repo to have read access to the
  # private @spacecorps/components package (package settings -> Manage Actions access).
  tokens:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions: { contents: read, packages: read }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24 }
      - run: node site/scripts/sync-tokens.mjs
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}", SYNC_SOFT_FAIL: "1" }
      - run: git diff --exit-code -- site/src/spacecorps-tokens.css

  # Routes of the nginx config against the built static site (cheap: no wasm, no image build).
  routes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24 }
      - run: corepack enable && corepack install
        working-directory: site
      - run: pnpm install --frozen-lockfile && pnpm run build
        working-directory: site
      - name: Serve dist with site/nginx.conf and crawl the docs
        run: |
          docker run -d --name s3d -p 8080:8080             -v "$PWD/site/dist:/usr/share/nginx/html:ro"             -v "$PWD/site/nginx.conf:/etc/nginx/conf.d/default.conf:ro"             nginxinc/nginx-unprivileged:stable-alpine
          sleep 3
          fail=0
          for p in / /play/editor/ /docs /docs/ /docs.html /docs/getting-started/ /docs/graphics/frame/ /examples.html /llms.txt; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L "http://localhost:8080$p")
            echo "$code $p"; [ "$code" = 200 ] || fail=1
          done
          # every internal link on the docs landing and on each docs page resolves
          for page in /docs/ $(find site/dist/docs -name index.html | sed 's#site/dist##; s#index.html$##'); do
            for l in $(curl -s "http://localhost:8080$page" | grep -o 'href="/[^"#]*' | cut -d'"' -f2 | sort -u); do
              code=$(curl -s -o /dev/null -w '%{http_code}' -L "http://localhost:8080$l")
              [ "$code" = 200 ] || { echo "BROKEN $code $l (on $page)"; fail=1; }
            done
          done
          exit $fail
