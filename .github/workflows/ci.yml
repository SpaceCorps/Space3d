name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libdbus-1-dev pkg-config
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude hello_cube_mobile --all-targets -- -D warnings
      # Kinsoku (Chinese and Japanese line breaking): third_party/epaint must be exactly the
      # published epaint + third_party/epaint.kinsoku.patch, have egui's version and be what
      # cargo resolves; after an egui bump run `python3 scripts/update-epaint.py`.
      - name: Patched epaint is consistent and used
        run: python3 scripts/update-epaint.py --check
      - name: Patched epaint tests (kinsoku + upstream)
        run: cargo test --manifest-path third_party/epaint/Cargo.toml --target-dir target/third_party --lib

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System deps + software GPU (Mesa lavapipe)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libdbus-1-dev pkg-config mesa-vulkan-drivers
      # Hosted runners have no real GPU (lavapipe, WARP, paravirtual Metal): GPU tests render
      # differently there or crash the driver, so they take their documented skip path
      # (SPACE3D_NO_GPU, see space3d-render). Everything else runs. GPU tests run in `gpu-tests`.
      - run: cargo test --workspace --exclude hello_cube_mobile --no-fail-fast
        env:
          SPACE3D_NO_GPU: "1"
          # Shared runners are slower than the dev machine the timing gates are calibrated on.
          SPACE3D_PERF_BUDGET_SCALE: "4"
      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs-${{ matrix.os }}
          path: "**/__screenshots__/**/*.{actual,diff}.png"
          if-no-files-found: ignore

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
      - name: Check runtime crates for web
        run: |
          cargo check --target wasm32-unknown-unknown \
            -p space3d-core -p space3d-tasks -p space3d-render -p space3d-platform \
            -p space3d-assets -p space3d-net -p space3d-db -p space3d-audio \
            -p space3d-physics -p space3d-scene -p space3d-ui -p space3d-particles -p space3d \
            -p space3d-replication
          cargo check --target wasm32-unknown-unknown -p space3d --features particles
      # Web game clients build the replication crate client-only (§15.3).
      - name: Check the replication client for web
        run: cargo check --target wasm32-unknown-unknown -p space3d-replication --no-default-features --features client

  # Dedicated servers ship with `--profile server` (panic = "unwind"): prove that a panicking
  # room is contained and restored in that profile, not only in the test profile (§15.3).
  server-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Room panics are contained (profile server)
        run: |
          cargo test --profile server -p space3d-server --test cluster -- \
            room_crash_is_contained a_crash_looping_room_is_closed a_room_crash_during_its_drain_handoff \
            a_stale_copy_rebuilt_after_a_crash
          cargo test --profile server -p space3d-server --test handoff -- crash
          cargo test --profile server -p space3d-server --test e2e

  mobile:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # rust-toolchain.toml pins the toolchain: add the targets to that one, not to `stable`.
      - run: rustup target add aarch64-apple-ios aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: iOS check
        run: cargo check --target aarch64-apple-ios -p space3d
      - uses: nttld/setup-ndk@v1
        id: ndk
        with: { ndk-version: r28 }
      - name: Android check
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          export CC_aarch64_linux_android=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/darwin-x86_64/bin/aarch64-linux-android35-clang
          export AR_aarch64_linux_android=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/darwin-x86_64/bin/llvm-ar
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$CC_aarch64_linux_android
          cargo check --target aarch64-linux-android -p space3d

  # Optional: the GPU tests on a software Vulkan device (Mesa lavapipe). Known to differ from
  # hardware in places (1-ulp / 1-LSB), so it reports but does not gate. Real GPU runners should
  # run `cargo test --workspace` with SPACE3D_REQUIRE_GPU=1.
  gpu-tests:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System deps + software GPU (Mesa lavapipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libdbus-1-dev pkg-config mesa-vulkan-drivers
      - run: cargo test --workspace --exclude hello_cube_mobile --no-fail-fast
        env:
          SPACE3D_PERF_BUDGET_SCALE: "4"
